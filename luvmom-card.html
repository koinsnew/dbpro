<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>럽맘 프로필·명함 제작기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap">
<style>
/* Layout: 왼쪽 입력 양식, 오른쪽 미리보기(모바일 프로필 / 명함 / 문자 안내문). 럽맘 앱 톤: 라벤더-핑크 그라데이션, 흰 둥근 카드, 핑크 알약 태그 */
:root{
  --bg:#faf3f7; --panel:#ffffff; --fg:#2b2629; --muted:#8a7d85; --line:#f0dfe8;
  --accent:#de668c; --accent-ink:#ffffff; --field:#fdf8fb; --stage:#f3e4ef;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  /* 이미지로 저장되는 카드 색 — 럽맘 브랜드 고정색 */
  --pink:#de668c; --pink-deep:#c94a74; --pink-soft:#fbe3ec; --lav:#efdcf1; --blush:#fbe9f0;
  --ink:#262224; --soft:#8c8288; --grey:#b9b4b7; --rule:#f1e3ea; --paper:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d181b; --panel:#272024; --fg:#f4ecf0; --muted:#ad9ea6; --line:#3b3036;
  --accent:#ef8aab; --accent-ink:#1d181b; --field:#2f272b; --stage:#171215; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d181b; --panel:#272024; --fg:#f4ecf0; --muted:#ad9ea6; --line:#3b3036;
  --accent:#ef8aab; --accent-ink:#1d181b; --field:#2f272b; --stage:#171215; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:20px}
header.top .logos{display:flex;align-items:center;gap:14px}
header.top img{height:38px;width:auto}
header.top img.hf{height:30px}
header.top .x,.mp-head .x{width:1px;align-self:stretch;background:var(--line)}
:root[data-theme="dark"] header.top img.hf{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top img.hf{filter:invert(1)}}
header.top h1{font-size:24px;font-weight:800;margin:0;text-wrap:balance}
header.top h1 span{color:var(--accent)}
header.top p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,600px);gap:24px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}.preview{order:-1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.form{display:flex;flex-direction:column;gap:22px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:10px;padding:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);min-width:0}
label small{opacity:.85}
label.check{flex-direction:row;align-items:center;gap:8px;font-size:13.5px;color:var(--fg)}
label.check input{accent-color:var(--accent);width:18px;height:18px}
input[type=text],input[type=tel],input[type=email],textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:64px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--field);border:1px dashed var(--accent);border-radius:14px;padding:10px 14px;color:var(--muted);font-size:13px}
.note b{color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.presets span{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
.presets button{font-size:12px;padding:5px 11px;color:var(--accent);border-color:var(--accent);background:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--fg);padding:9px 16px}
button.send{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:700}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.5;cursor:default}
.file{position:relative;overflow:hidden;border-radius:999px}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.tabs{display:flex;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.stage{background:var(--stage);border-radius:18px;padding:24px 12px;display:flex;justify-content:center;overflow:hidden}
.fit{transform-origin:top left}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sms{width:100%;min-height:280px;font-size:14px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:20}
.modal{position:fixed;inset:0;background:rgba(30,20,26,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal .box{background:var(--panel);border-radius:18px;padding:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal img{width:100%;border-radius:10px;border:1px solid var(--line)}
.modal p{margin:0;color:var(--muted);font-size:13px}

/* ───────── 모바일 프로필 (360px → 1080px 저장) ───────── */

  background-color:var(--blush);

  background-repeat:no-repeat,no-repeat;background-size:360px 520px,100% 100%;background-position:0 0,0 0}
.mp-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 10px}
.mp-head img{height:36px;width:auto;display:block}
.mp-head .co{display:flex;align-items:center;gap:12px}
.mp-head img.hf{height:26px}
.mp-head .x{background:#e7c9d6;height:28px;align-self:center}
.pill{display:inline-block;background:#fff;color:var(--pink);font-weight:700;font-size:11px;padding:5px 12px;border-radius:999px}
.mp-hero{margin:8px 22px 0;height:380px;border-radius:26px;border:4px solid #fff;background-color:var(--pink-soft);background-repeat:no-repeat;position:relative;box-shadow:0 10px 24px rgba(201,74,116,.16)}
.mp-hero .pill{position:absolute;left:14px;bottom:14px;font-size:12px;padding:6px 14px}
.mp-intro{padding:24px 26px 4px}
.mp-hello{font-size:19px;font-weight:500;color:var(--ink)}
.mp-name{margin-top:2px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mp-name strong{font-size:36px;font-weight:800;letter-spacing:.06em;color:var(--pink);line-height:1.25}
.mp-name em{font-style:normal;font-weight:700;font-size:17px;color:var(--ink)}
.mp-name span{font-size:17px;font-weight:500}
.mp-en{font-size:12px;letter-spacing:.14em;color:var(--soft);margin-top:2px}
.mp-chips{display:flex;flex-wrap:wrap;gap:6px;padding:14px 22px 0}
.mp-chips span{font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:999px;background:#fff;color:var(--pink)}
.card{margin:14px 22px 0;background:#fff;border-radius:20px;padding:16px 18px}
.mp-quote{font-size:13.5px;line-height:1.75;color:var(--ink)}
.mp-quote b{color:var(--pink)}
.mp-row{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule)}
.mp-row:first-child{padding-top:2px}
.mp-row:last-child{border-bottom:0;padding-bottom:2px}
.mp-row .k{width:18px;flex:0 0 18px;font-size:17px;font-weight:700;color:var(--pink);line-height:1.5;text-align:center}
.mp-row .k.g{color:var(--grey)}
.mp-row .v{min-width:0;font-size:16px;font-weight:500;letter-spacing:.01em;overflow-wrap:anywhere;word-break:keep-all;line-height:1.5}
.mp-row .v small{display:block;font-size:10.5px;color:var(--soft);font-weight:400;letter-spacing:0}
.mp-row .v.addr{font-size:13.5px}
.mp-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 22px 0}
.mp-info>div{background:#fff;border-radius:16px;padding:12px 14px}
.mp-info .t{font-size:11px;font-weight:700;color:var(--pink)}
.mp-info .v{font-size:12.5px;font-weight:500;margin-top:3px;line-height:1.5;word-break:keep-all}
.mp-app{margin:16px 22px 0;border-radius:22px;padding:18px 18px 16px;background-image:linear-gradient(135deg,#f6d4e9 0%,#f9dde8 55%,#fde9ef 100%);position:relative}
.mp-app .h{font-size:13px;color:var(--ink);font-weight:500}
.mp-app .b{font-size:21px;font-weight:800;line-height:1.3;color:var(--ink);margin-top:2px}
.mp-app .b span{color:var(--pink)}
.mp-app .s{font-size:12px;color:var(--soft);margin-top:6px}
.mp-app .stars{position:absolute;right:16px;top:16px;background:#fff;border-radius:14px;padding:6px 10px;text-align:center}
.mp-app .stars b{display:block;font-size:17px;color:var(--pink);line-height:1.2}
.mp-app .stars i{font-style:normal;font-size:9.5px;color:var(--soft)}
.mp-app .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.mp-app .tags span{background:#fff;color:var(--pink);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.mp-foot{margin-top:22px;background:var(--pink);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mp-foot img{height:24px;width:auto;display:block}
.mp-foot .co{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.mp-foot img.hf{height:18px}
.mp-foot .x{width:1px;height:20px;background:rgba(255,255,255,.6)}
.mp-foot .r{font-size:11.5px;text-align:right;font-weight:500;white-space:nowrap}
.mp-foot.hfon{flex-direction:column;gap:8px;padding:16px 22px 14px}
.mp-foot.hfon .r{text-align:center}

/* ───────── 명함 (540×300 → 1620×900, 90×50mm) — 럽맘 실제 명함 구성 ───────── */
.bc{width:540px;height:300px;background:var(--paper);color:var(--ink);font-family:var(--f-body);position:relative;overflow:hidden}
.bc-name{position:absolute;left:40px;top:42px;display:flex;align-items:baseline;gap:8px}
.bc-name strong{font-size:25px;font-weight:700;letter-spacing:.12em}
.bc-name em{font-style:normal;font-size:15px;font-weight:500}
.bc-en{position:absolute;left:41px;top:84px;font-size:12.5px;letter-spacing:.04em}
.bc-branch{position:absolute;left:41px;top:104px;font-size:11px;color:var(--soft)}
.bc-logo{position:absolute;right:34px;top:30px;display:flex;flex-direction:column;align-items:center;gap:2px}
.bc-logo img{height:50px;width:auto;display:block}
.bc-logo span{font-size:15px;font-weight:700;color:var(--pink);letter-spacing:.12em}
.bc-hf{position:absolute;right:34px;bottom:32px;height:34px;width:auto}
.bc-hf.up{bottom:auto;top:112px;height:22px;right:38px}
.bc-photo{bottom:22px!important;height:118px!important}
.bc-rows{position:absolute;left:44px;bottom:30px;display:flex;flex-direction:column;gap:7px}
.bc-rows div{display:flex;gap:14px;align-items:baseline;font-size:15px;letter-spacing:.01em}
.bc-rows b{width:14px;font-weight:700;color:var(--pink);text-align:center;font-size:14px}
.bc-rows b.g{color:var(--grey)}
.bc-rows .small{font-size:11.5px;color:var(--ink)}
.bc-photo{position:absolute;right:34px;bottom:28px;width:104px;height:130px;border-radius:16px;background-color:var(--pink-soft);background-repeat:no-repeat;border:3px solid var(--pink-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <div>
      <h1><span>럽맘</span> 프로필·명함 제작기</h1>
      <p>내 정보와 사진을 넣으면 고객님께 문자로 보낼 모바일 프로필과 명함 이미지가 바로 만들어집니다. 입력한 내용은 이 기기에 저장되어 다음에 열어도 그대로 남아 있어요.</p>
    </div>
  </header>

  <div class="layout">
    <form class="panel form" id="form" autocomplete="off">
      <div class="note" id="exampleNote">지금은 <b>예시 정보</b>가 들어 있어요. 본인 정보와 사진으로 바꿔 주세요.</div>

      <fieldset>
        <legend>사진</legend>
        <div class="row">
          <span class="file"><button type="button" class="primary">내 사진 올리기</button><input type="file" id="photo" accept="image/*"></span>
          <label class="check"><input type="checkbox" id="cardPhoto"> 명함에도 사진 넣기</label>
        </div>
        <div class="grid2">
          <label>사진 확대 <input type="range" id="zoom" min="100" max="250" value="100"></label>
          <label>좌우 위치 <input type="range" id="px" min="0" max="100" value="50"></label>
          <label>위아래 위치 <input type="range" id="py" min="0" max="100" value="25"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>기본 정보</legend>
        <div class="grid2">
          <label>이름 <input type="text" id="name"></label>
          <label>직급 <input type="text" id="title"></label>
          <label>영문 이름 <input type="text" id="nameEn"></label>
          <label>지점명 <input type="text" id="branch"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>연락처</legend>
        <div class="grid2">
          <label>T · 회사 전화 <input type="tel" id="tel"></label>
          <label>M · 휴대폰 <input type="tel" id="hp"></label>
          <label>F · 팩스 <small>(비우면 표시 안 함)</small><input type="tel" id="fax"></label>
          <label>K · 카카오톡 ID <small>(비우면 표시 안 함)</small><input type="text" id="kakao"></label>
        </div>
        <label>E · 이메일 <input type="email" id="email"></label>
        <label>A · 회사 주소 <input type="text" id="addr"></label>
      </fieldset>

      <fieldset>
        <legend>고객님께 보여 드릴 내용</legend>
        <label>인사말 <textarea id="greet" rows="3"></textarea></label>
        <div class="presets" id="presets" aria-label="인사말 예시"></div>
        <div class="grid2">
          <label>상담 가능 시간 <input type="text" id="hours"></label>
          <label>경력 · 자격 <input type="text" id="career"></label>
        </div>
        <label>담당 서비스 태그 <small>(쉼표로 구분)</small><input type="text" id="svc"></label>
        <label>하단 문구 <input type="text" id="footer"></label>
        <label class="check"><input type="checkbox" id="showHF"> 지사 로고(Heritage Finance) 넣기</label>
      </fieldset>

      <div class="row"><button type="button" id="reset">예시로 되돌리기</button></div>
    </form>

    <section class="preview panel" aria-label="미리보기">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="mp" aria-selected="true">모바일 프로필</button>
        <button type="button" role="tab" data-tab="bc" aria-selected="false">명함</button>
        <button type="button" role="tab" data-tab="sms" aria-selected="false">문자 안내문</button>
      </div>
      <div id="pane-mp">
        <div class="stage" id="stage-mp"><div class="fit" id="fit-mp"><div class="mp" id="mp"></div></div></div>
        <div class="actions">
          <button type="button" class="primary" data-export="mp">프로필 이미지 저장</button>
          <button type="button" data-export="both">프로필 + 명함 모두 저장</button>
          <button type="button" class="send" data-send hidden>📤 고객에게 보내기</button>
        </div>
      </div>
      <div id="pane-bc" hidden>
        <div class="stage" id="stage-bc"><div class="fit" id="fit-bc"><div class="bc" id="bc"></div></div></div>
        <div class="actions"><button type="button" class="primary" data-export="bc">명함 이미지 저장</button><button type="button" class="send" data-send hidden>📤 고객에게 보내기</button></div>
      </div>
      <div id="pane-sms" hidden>
        <textarea class="sms" id="sms" aria-label="문자 안내문"></textarea>
        <div class="actions">
          <button type="button" class="primary" id="copySms">문구 복사</button>
          <button type="button" id="regenSms">내 정보로 다시 만들기</button>
          <button type="button" class="send" data-send hidden>📤 고객에게 보내기</button>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="box">
    <p>이미지를 길게 누르거나(휴대폰) 마우스 오른쪽 버튼을 눌러(PC) 저장하세요.</p>
    <div id="modalImgs" style="display:flex;flex-direction:column;gap:10px"></div>
    <button type="button" id="closeModal">닫기</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

function ensureDims(src){ if(imgs[src]) return; const im=new Image(); imgs[src]=im; im.onload=()=>{imgDims[src]={w:im.naturalWidth,h:im.naturalHeight}; render();}; im.src=src; }
/* 사진 상자 크기에 맞춘 배치 계산 (미리보기와 저장 이미지가 똑같이 쓰는 값) */
function geom(bw,bh){
  const src=S.photo||PLACEHOLDER, d=imgDims[src]; if(!d) return null;
  const k=Math.max(bw/d.w,bh/d.h)*(S.zoom/100), dw=d.w*k, dh=d.h*k;
  return {src,dw,dh,ox:(bw-dw)*S.px/100,oy:(bh-dh)*S.py/100};
}
function applyPhotos(root){
  root.querySelectorAll("[data-photo]").forEach(el=>{
    const bw=el.clientWidth, bh=el.clientHeight, g=geom(bw,bh), src=S.photo||PLACEHOLDER;
    el.style.backgroundImage=`url('${src}')`;
    if(!g){ el.style.backgroundSize="cover"; el.style.backgroundPosition=`${S.px}% ${S.py}%`; return; }
    el.style.backgroundSize=`${g.dw}px ${g.dh}px`; el.style.backgroundPosition=`${g.ox}px ${g.oy}px`;
  });
}
/* 저장용 고화질 잘라내기: 최종 픽셀 크기에 맞춰 단계적으로 줄여서 그림 → 흐림·계단 현상 방지 */
function hiCrop(bw,bh,scale){
  const g=geom(bw,bh), im=imgs[S.photo||PLACEHOLDER]; if(!g||!im||!im.complete) return null;
  const W=Math.round(bw*scale), H=Math.round(bh*scale), tw=g.dw*scale, th=g.dh*scale;
  let src=im, sw=im.naturalWidth, sh=im.naturalHeight;
  while(sw/2>tw && sh/2>th){
    const c=document.createElement("canvas"); c.width=Math.round(sw/2); c.height=Math.round(sh/2);
    const x=c.getContext("2d"); x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high"; x.drawImage(src,0,0,c.width,c.height);
    src=c; sw=c.width; sh=c.height;
  }
  const out=document.createElement("canvas"); out.width=W; out.height=H;
  const x=out.getContext("2d"); x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high";
  x.drawImage(src,0,0,sw,sh,g.ox*scale,g.oy*scale,tw,th);
  return out.toDataURL("image/png");
}

function readImage(file,max,cb){
  const r=new FileReader(); r.onload=()=>{const im=new Image(); im.onload=()=>{
    if(Math.max(im.width,im.height)<=max){ cb(r.result); return; } /* 충분히 작으면 원본 그대로 */
    let src=im, w=im.width, h=im.height; const tw=Math.round(w*max/Math.max(w,h)), th=Math.round(h*max/Math.max(w,h));
    while(w/2>tw){ const c=document.createElement("canvas"); c.width=Math.round(w/2); c.height=Math.round(h/2);
      const x=c.getContext("2d"); x.imageSmoothingQuality="high"; x.drawImage(src,0,0,c.width,c.height); src=c; w=c.width; h=c.height; }
    const cv=document.createElement("canvas"); cv.width=tw; cv.height=th; const x=cv.getContext("2d"); x.imageSmoothingQuality="high";
    x.drawImage(src,0,0,tw,th); cb(cv.toDataURL("image/jpeg",.96)); }; im.src=r.result; }; r.readAsDataURL(file);
}

async function capture(id){
  try{await document.fonts.ready;}catch(e){}
  const SCALE=4, node=$(id);
  const crops=[...node.querySelectorAll("[data-photo]")].map(el=>hiCrop(el.clientWidth,el.clientHeight,SCALE));
  return html2canvas(node,{scale:SCALE,backgroundColor:"#ffffff",useCORS:true,logging:false,
    onclone:doc=>{
      doc.querySelectorAll(".fit").forEach(e=>e.style.transform="none");
      /* 배경 이미지는 라이브러리가 화면 크기로 줄여 그려서 흐려짐 → 원본 해상도 <img>로 교체 */
      doc.getElementById(id).querySelectorAll("[data-photo]").forEach((el,i)=>{ if(!crops[i]) return;
        const live=$(id).querySelectorAll("[data-photo]")[i], cs=getComputedStyle(live);
        const bt=parseFloat(cs.borderTopWidth)||0, r=Math.max(0,(parseFloat(cs.borderTopLeftRadius)||0)-bt);
        el.style.backgroundImage="none";
        const im=doc.createElement("img"); im.src=crops[i];
        im.style.cssText=`position:absolute;left:0;top:0;width:${live.clientWidth}px;height:${live.clientHeight}px;max-width:none;border-radius:${r}px;display:block;`;
        el.insertBefore(im,el.firstChild);
        el.querySelectorAll(".pill").forEach(p=>{p.style.zIndex="1";});
      });
    }});
}

/* ===== 데이터 PRO 연동: 부모 창(데이터 PRO) 안에서 열렸을 때만 "고객에게 보내기" 사용 ===== */
const IN_APP = window.parent && window.parent !== window;
if(IN_APP) document.querySelectorAll("[data-send]").forEach(b=>{ b.hidden=false; b.addEventListener("click",()=>window.parent.postMessage({type:"card-send-request"},"*")); });
window.addEventListener("message", async e=>{
  if(!e.data || e.data.type!=="card-make-files") return;
  try{
    const out=[], nm=(S.name||"프로필").replace(/\s+/g,"");
    for(const id of ["mp","bc"]){
      const p=$("pane-"+id), was=p.hidden; p.hidden=false;
      const cv=await capture(id); p.hidden=was;
      const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
      out.push({blob, filename:nm+"_"+(id==="mp"?"모바일프로필":"명함")+".png"});
    }
    fit();
    e.source.postMessage({type:"card-files", files:out, text:smsText()},"*");
  }catch(err){ e.source.postMessage({type:"card-files", error:String(err&&err.message||err)},"*"); }
});
idbGet("photo").then(p=>{ if(p&&!S.photo){ S.photo=p; render(); } else if(S.photo&&!p){ idbSet("photo",S.photo); save(); } });
if(document.fonts) document.fonts.ready.then(fit);
</script>

</body></html>
